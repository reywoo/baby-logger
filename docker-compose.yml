name: family-assistant

services:
  postgres:
    image: postgres:16-alpine
    container_name: family_assistant_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-family_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  family-assistant:
    container_name: family_assistant
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
